# Platforme za preprodaju (stanje istraživanja: studeni 2026.).
# Naknade su PROCJENE iz javnih izvora – uvijek provjeri iznos na ekranu prije objave oglasa.
#
# seller_fee_pct   – postotak koji platforma odbija prodavatelju
# seller_fee_fixed – fiksna naknada po ulaznici (EUR)
# cap              – "none" | "face" | "percent" (dodatno uz zakonski limit države)
# cap_pct          – za cap = "percent" (npr. 0.20 = +20 %)
# cap_basis        – "face" (nominalna cijena) ili "paid" (plaćeno s naknadama)
# reach            – 0..1, koliko kupaca platforma realno dovodi (utječe na vjerojatnost prodaje)
# price_factor     – realno postiziva cijena u odnosu na tržišnu (viagogo = 1.0; lokalni kupci plaćaju manje)
# trust_risk       – 0..1, rizik prijevare / spora / zadržane isplate
# countries        – države DOGAĐAJA gdje platforma ima smisla; "*" = svugdje
# seller_countries – države PREBIVALIŠTA prodavatelja koje platforma prihvaća (izostavljeno = bez ograničenja)
# local            – lokalni kanal (oglasnik/grupe): izvan svoje države prodaješ teško (manji doseg, veći rizik)
# requires_vendor  – platforma radi samo za ulaznice kupljene kod tog prodavača
# [x.overrides.CC] – drugačija pravila za državu događaja CC

