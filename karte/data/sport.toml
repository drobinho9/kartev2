# Pravila preprodaje ulaznica za sport – prvenstveno NOGOMET (stanje istraživanja: studeni 2026.).
# Vrijede DODATNO uz opća pravila države (laws.toml); primjenjuje se strože pravilo.
#
# rule:
#   "criminal"             – neovlaštena preprodaja je kazneno djelo (bez obzira na cijenu)
#   "face"                 – zakonom zabranjeno iznad nominalne cijene
#   "club_terms"           – uvjeti klubova/saveza zabranjuju preprodaju; ulaznice se poništavaju, članstva blokiraju
#   "official_only"        – preprodaja samo preko službenog kanala organizatora (obično po nominalnoj cijeni)
#   "official_marketplace" – preprodaja samo na službenom tržištu organizatora, cijena slobodna, uz naknade
#   "none"                 – nema posebnih sportskih ograničenja (vrijede opća pravila države)
# personalized: tipično ulaznice na ime uz provjeru osobne
# official: službeni kanal za preprodaju (ako ne možeš ići)
#
# Nije pravni savjet – provjeri uvjete prodaje konkretnog kluba/natjecanja.

# ===================================================================== NOGOMET PO DRŽAVAMA
[football.default]
name = "Nogomet (općenito)"
rule = "club_terms"
personalized = true
risk = 0.75
official = "službena razmjena kluba (po nominalnoj cijeni)"
summary = "Većina klubova i saveza u uvjetima prodaje zabranjuje neovlaštenu preprodaju; ulaznice su često na ime uz provjeru osobne, a preprodane se poništavaju."
how_to_buy = [
  "Klubovi prodaju redom: sezonske ulaznice → članovi (često po bodovima lojalnosti ili ždrijebom) → javna prodaja (za velike utakmice često je nema).",
  "Ako ne možeš ići: koristi službenu razmjenu/prijenos kluba (vraća novac po nominalnoj cijeni).",
]

[football.HR]
name = "Hrvatska – nogomet"
rule = "club_terms"
personalized = true
risk = 0.85
official = "službeni prijenos/oslobađanje mjesta kluba (npr. Dinamo – prijenos sjedala)"
summary = "Dinamo prodaje samo online (tickets.gnkdinamo.hr), ulaznice glase na ime i na ulazu se traži osobni dokument; derbiji često samo za članove. Hajduk prodaje preko hajduk.mojekarte.hr s prednošću članovima (100.000+ članova) – za derbi ulaznice često ne dođu u slobodnu prodaju. HNS zadržava vlasništvo nad ulaznicama, poništava preprodane i prijavljuje policiji. Zakon o sprječavanju nereda na sportskim natjecanjima: kupnja ili omogućavanje kupnje osobi sa zabranom je prekršaj (novčana kazna ili zatvor do 30 dana)."
how_to_buy = [
  "Dinamo: tickets.gnkdinamo.hr – ulaznica na ime, osobna na ulazu; za derbije prednost/isključivo članovi.",
  "Hajduk: hajduk.mojekarte.hr – prednost aktivnim članovima; za veće utakmice učlani se na vrijeme.",
  "Reprezentacija (HNS): ulaznice na ime, provjera osobne; preprodane se poništavaju.",
]
sources = [
  "https://gnkdinamo.hr/en/news/ulaznice-za-utakmicu-dinamo-hajduk",
  "https://www.index.hr/clanak.aspx?id=2520221",
  "https://www.croatiaweek.com/new-measures-to-stop-black-market-tickets-for-croatia-games/",
  "https://www.zakon.hr/z/445/zakon-o-sprjecavanju-nereda-na-sportskim-natjecanjima",
]

[football.GB]
name = "UK – nogomet"
rule = "criminal"
personalized = false
risk = 0.95
official = "službena Ticket Exchange kluba"
summary = "Criminal Justice and Public Order Act 1994, čl. 166: prodaja ulaznice za nogometnu utakmicu bez ovlaštenja kluba/organizatora je kazneno djelo – po bilo kojoj cijeni, i online. Klubovi masovno poništavaju račune: Arsenal ~74.000 računa i 17.500 članstava, Chelsea 16.000 članstava, Liverpool 432 doživotne zabrane i 1,2 mil. £ zaplijenjene imovine (2026.). Novi zakon o preprodaji ulaznica nogomet ne mijenja."
how_to_buy = [
  "Članstvo (membership) + bodovi lojalnosti (loyalty points) + ždrijeb (ballot); za velike klubove bez bodova gotovo nemoguće.",
  "Službena Ticket Exchange / Ticket Transfer kluba za karte koje ne možeš iskoristiti.",
  "Hospitality samo izravno od kluba ili preko službenih ovlaštenih agenata.",
]
sources = [
  "https://www.legislation.gov.uk/ukpga/1994/33/section/166",
  "https://www.liverpoolfc.com/news/lfc-and-merseyside-police-work-together-seize-ps12m-assets-ticket-touts",
  "https://www.arsenal.com/news/annual-mens-ticketing-update-2026-aO6Q33k1FAlw",
  "https://www.insideworldfootball.com/2026/05/01/chelsea-weeds-ticket-touts-suspension-16000-club-memberships-season/",
]

