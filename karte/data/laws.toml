# Pravila preprodaje ulaznica po državama (stanje istraživanja: studeni 2026.).
#
# cap:
#   "none"                 – nema zakonskog ograničenja cijene preprodaje
#   "face"                 – preprodaja iznad originalne cijene zabranjena
#   "percent"              – dopušteno do cap_pct iznad originalne cijene
#   "percent_or_abs"       – do cap_pct, ali najviše cap_abs EUR iznad originalne cijene
#   "organizer_permission" – preprodaja (radi zarade) samo uz dopuštenje organizatora
# cap_basis: "face" (nominalna cijena) ili "paid" (plaćeno, uklj. neizbježne naknade)
# planned_*: najavljena pravila koja još NISU na snazi – primjenjuju se samo uz --strict
# Ključevi tipa "US-VT", "CA-ON", "AU-NSW" su pravila saveznih država/pokrajina; nasljeđuju polja države.
#
# VAŽNO: ovo nije pravni savjet. Provjeri aktualne propise prije kupnje.

[default]
name = "Nepoznato"
cap = "none"
risk = 0.35
summary = "Pravila za ovu državu nisu u bazi. Provjeri lokalne propise i uvjete prodaje organizatora prije kupnje radi preprodaje."
eu = false

