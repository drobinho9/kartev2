# Pravila preprodaje ulaznica po državama (stanje istraživanja: studeni 2026.).
#
# cap:
#   "none"                 – nema zakonskog ograničenja cijene preprodaje
#   "face"                 – preprodaja iznad originalne cijene zabranjena
#   "percent"              – dopušteno do cap_pct iznad originalne cijene
#   "percent_or_abs"       – do cap_pct, ali najviše cap_abs EUR iznad originalne cijene
#   "organizer_permission" – preprodaja (radi zarade) samo uz dopuštenje organizatora
# cap_basis: "face" (nominalna cijena) ili "paid" (plaćeno, uklj. neizbježne naknade)
# planned_*: najavljena pravila koja još NISU na snazi – primjenjuju se samo uz --strict
#
# VAŽNO: ovo nije pravni savjet. Provjeri aktualne propise prije kupnje.

[default]
name = "Nepoznato"
cap = "none"
risk = 0.35
summary = "Pravila za ovu državu nisu u bazi. Provjeri lokalne propise i uvjete prodaje organizatora prije kupnje radi preprodaje."
eu = false

[HR]
name = "Hrvatska"
cap = "none"
risk = 0.15
eu = true
summary = "Nema zakonskog ograničenja cijene preprodaje koncertnih ulaznica. Zabranjena je preprodaja ulaznica kupljenih automatiziranim sredstvima (botovi) kojima se zaobilazi limit kupnje – Zakon o zaštiti potrošača (NN 19/22, na snazi od 28. 5. 2022.), prijenos Omnibus direktive. Za nogometne utakmice HNS poništava preprodane ulaznice i provjerava ime na ulaznici uz osobnu iskaznicu – izbjegavati."
sources = [
  "https://narodne-novine.nn.hr/clanci/sluzbeni/2022_02_19_203.html",
  "https://informator.hr/strucni-clanci/novosti-u-zastiti-potrosaca",
  "https://www.croatiaweek.com/new-measures-to-stop-black-market-tickets-for-croatia-games/",
]

[SI]
name = "Slovenija"
cap = "none"
risk = 0.2
eu = true
summary = "Nije pronađen poseban zakon o cijeni preprodaje. Vrijedi EU zabrana preprodaje ulaznica kupljenih botovima (Omnibus direktiva). Provjeri uvjete organizatora (personalizacija)."

[AT]
name = "Austrija"
cap = "none"
risk = 0.25
eu = true
summary = "Nema posebnog zakona o cijeni preprodaje. Vrijedi EU zabrana botova. Organizatori (Eventim AT, oeticket) često personaliziraju ulaznice – provjeri uvjete. Austrija bi mogla slijediti njemački model ograničenja."

[HU]
name = "Mađarska"
cap = "none"
risk = 0.3
eu = true
summary = "Nije pronađen poseban zakon o cijeni preprodaje (neprovjereno u detalje). Vrijedi EU zabrana botova. Provjeri uvjete organizatora."

[DE]
name = "Njemačka"
cap = "none"
cap_basis = "paid"
risk = 0.35
eu = true
planned_cap = "percent_or_abs"
planned_cap_pct = 0.20
planned_cap_abs = 20.0
summary = "Trenutno nema zakonskog limita cijene, ali organizatori smiju ograničiti preprodaju u uvjetima (personalizirane ulaznice). Ministrica pravosuđa Hubig je u studenom 2026. najavila 'Ticketschutzgesetz': preprodaja najviše 20 % iznad originalne cijene, a maksimalno +20 EUR, s ciljem stupanja na snagu prije ljeta 2027. Ne kupuj za događaje nakon tog datuma računajući na veliku maržu."
sources = [
  "https://www.iamexpat.de/lifestyle/lifestyle-news/germany-plans-cap-ticket-resales-20-over-original-price",
  "https://cms.law/de/deu/legal-updates/neue-koalition-will-ticketzweitmarkt-staerker-regulieren",
]

