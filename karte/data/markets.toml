# Tržišta: veličina sekundarnog tržišta, pokrivenost Ticketmasterom i dostupnost za prodavača iz Hrvatske/EU.
# (stanje istraživanja: studeni 2026.)
#
# size        – 0..1, relativna veličina/likvidnost sekundarnog tržišta koncerata (SAD = 1.0)
# access_risk – 0..1, koliko je teško kupovati i prodavati iz HR (računi, mobitel, isplate, valuta, platforme)
# tm          – pokrivenost Ticketmaster Discovery API-jem: "da" | "djelomično" | "ne"
# access      – praktične napomene za kupnju i prodaju iz inozemstva

[regions]
# Zadano: tržišta bez zakonskog limita cijene i dostupna iz HR
otvoreno = ["HR", "SI", "AT", "HU", "CZ", "SK", "DE", "NL", "SE", "CH", "GB", "US", "RS", "BA"]
balkan = ["HR", "SI", "BA", "RS", "ME", "MK"]
srednja_europa = ["AT", "HU", "CZ", "SK", "PL", "SI", "HR", "RO", "BG"]
dach = ["DE", "AT", "CH"]
benelux = ["NL", "BE", "LU"]
nordijske = ["SE", "NO", "DK", "FI"]
zapadna_europa = ["GB", "IE", "FR", "ES", "PT", "IT", "NL", "BE", "DE", "CH", "AT"]
europa = ["HR", "SI", "AT", "HU", "CZ", "SK", "PL", "RO", "BG", "RS", "BA", "ME", "MK", "GR", "DE", "CH", "NL", "BE", "LU", "FR", "ES", "PT", "IT", "GB", "IE", "SE", "NO", "DK", "FI", "TR"]
sjeverna_amerika = ["US", "CA", "MX"]
oceanija = ["AU", "NZ"]
azija = ["JP", "KR", "SG", "HK", "AE"]
latam = ["MX", "BR", "AR", "CL", "CO"]
# "svijet" = svi izvori bez filtra države (Ticketmaster vraća sva svoja tržišta)
svijet = ["ALL"]

[markets.HR]
name = "Hrvatska"
size = 0.08
access_risk = 0.0
tm = "djelomično"
access = "Domaće tržište: Entrio, Eventim.hr, Ulaznice.hr (bez API-ja → CSV). Prodaja: Njuškalo, Facebook, viagogo."

