# Primarni prodavači ulaznica (službena prodaja) po državama – gdje se kupuje po NOMINALNOJ cijeni.
# Stanje istraživanja: studeni 2026. Naknade su OKVIRNE procjene iz javnih primjera (npr. Which?: Ticketmaster UK
# na ulaznicu od 45 £ ukupno 55,60 £, See Tickets 54,87 £; IQ International Ticketing Report: u Mađarskoj 2–10 %).
# Stvarnu naknadu uvijek vidiš na blagajni – ovdje služi samo za procjenu troška kupnje.
#
# fee_pct / fee_fixed  – naknada kupca (postotak + fiksno po ulaznici u EUR)
# countries            – države u kojima je prodavač važan za koncerte
# domains.CC           – web adresa za državu CC (za poveznice "Provjeri cijene"); domain = zadana adresa
# queue                – virtualni red / način prodaje
# resale               – službena preprodaja i pravila
# transferable = false – ulaznice se ne mogu prenijeti/preprodati izvan službenog kanala (npr. DICE)
# kind                 – "ticketing" (prodavač) ili "promoter" (organizator s vlastitom stranicom; kupnja ide preko partnera)

[ticketmaster]
name = "Ticketmaster"
kind = "ticketing"
domain = "ticketmaster.com"
countries = ["GB", "IE", "NL", "BE", "DE", "AT", "CH", "ES", "FR", "PL", "CZ", "SE", "NO", "DK", "FI", "US", "CA", "MX", "AU", "NZ", "AE", "TR"]
fee_pct = 0.12
fee_fixed = 2.5
queue = "Smart Queue: tko uđe prije početka prodaje dobiva nasumično mjesto u redu; Verified Fan i presale kodovi za velike turneje."
resale = "Ticketmaster Resale / Fan-to-Fan (UK i IE: najviše nominalna cijena); Face Value Exchange kad izvođač tako odluči."
transfer = "Prijenos u aplikaciji (SafeTix) – često otključan tek nekoliko dana prije događaja."
notes = "Jedan račun po osobi; narudžbe preko limita povezane imenom, e-mailom, adresom ili karticom se poništavaju."

