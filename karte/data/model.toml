# Parametri modela procjene zarade. Sve se može nadjačati vlastitom datotekom:
#   karte scan --model mojmodel.toml
# (dovoljno je navesti samo vrijednosti koje mijenjaš).
# Detaljno objašnjenje: docs/MODEL.md

[demand]
# Popularnost izvođača (Last.fm slušatelji): ispod 'low' = 0, iznad 'high' = 1 (log skala).
# Napomena: Last.fm brojke su ~5–10× manje od Spotify mjesečnih slušatelja (top izvođači ~5–9 mil.).
listeners_low = 50_000
listeners_high = 5_000_000
# Omjer slušatelja i ukupnog kapaciteta (kapacitet × broj koncerata u državi)
ratio_low = 10
ratio_high = 1_000
weight_popularity = 0.45
weight_scarcity = 0.40
weight_tour = 0.15
# Oznake (buzz) guraju potražnju prema 1: score = base + buzz_strength × buzz × (1 − base)
buzz_strength = 0.6
# Kad postoje stvarne cijene sa sekundarnog tržišta, one nose ovoliki udio potražnje
secondary_weight = 0.6
# Zadane vrijednosti kad podatak nedostaje
default_popularity = 0.35
default_scarcity = 0.40
default_tour = 0.5
default_capacity = 5000
# Turneja: ≤ tour_small koncerata = maksimalna rijetkost, ≥ tour_large = nimalo
tour_small = 10
tour_large = 100

[buzz]
# Oznake (tags) koje povećavaju potražnju; zbroj se ograničava na 1.0
farewell = 0.45        # oproštajna turneja
reunion = 0.45         # povratak/okupljanje benda
first_visit = 0.30     # prvi put u državi/regiji
added_date = 0.35      # dodatni datum jer je prvi rasprodan
anniversary = 0.15     # obljetnička turneja
new_album = 0.10
festival_headliner = 0.10
regional_star = 0.40   # jaka lokalna baza koju Last.fm podcjenjuje (balkanske zvijezde)
# sport
derby = 0.45           # derbi / lokalni rival
final = 0.60           # finale
playoff = 0.45         # doigravanje / nokaut faza
rivalry = 0.35         # tradicionalno rivalstvo
big_match = 0.30       # velika utakmica (vrhunski klubovi, prvo mjesto)
title_decider = 0.35   # odlučuje o naslovu
legend_farewell = 0.45 # oproštaj legende
soldout = 0.50         # događaj je rasprodan na primarnom tržištu

[resale]
# Bez podataka sa sekundarnog tržišta: multiplikator = base + slope × potražnja^exponent
base_multiplier = 0.80
demand_slope = 1.70
demand_exponent = 2.0
# Sa sekundarnim podacima: oglašena cijena ≠ prodajna cijena
# Udio kupčevih naknada u cijeni koju vidi kupac (viagogo/StubHub prikazuju ukupnu cijenu)
buyer_fee_share = 0.20
haircut_lowest = 0.95   # moraš malo podrezati najjeftiniji oglas
haircut_median = 0.85   # medijan oglasa precjenjuje realne prodaje
# Pad cijena pred događaj za srednju/slabu potražnju
late_days = 10
late_decay = 0.90
late_decay_max_demand = 0.6

[sell]
# Vjerojatnost prodaje = p_base + p_slope × potražnja, korigirano dosegom platforme
p_base = 0.40
p_slope = 0.55
reach_floor = 0.85
# Bonus kad je cijena postavljena prema stvarnim oglasima (ispod najnižeg)
secondary_bonus = 0.08
# Bonus kad je cijena ograničena ispod tržišne (zakon/platforma) – lakše se proda
capped_bonus = 0.15
p_max = 0.97
# Ako se ne proda: prodaja "u bescjenje" kao udio nominalne cijene
salvage_ratio = 0.60

[primary_fees]
# Naknade kod kupnje na primarnom tržištu (postotak + fiksno po ulaznici, EUR)
default_pct = 0.10
default_fixed = 1.0

[primary_fees.vendors]
ticketmaster = { pct = 0.12, fixed = 0.0 }
eventim = { pct = 0.10, fixed = 1.5 }
entrio = { pct = 0.0, fixed = 1.5 }
ulaznice_hr = { pct = 0.0, fixed = 1.0 }
seatgeek = { pct = 0.15, fixed = 0.0 }

[verdict]
buy_roi = 0.30          # minimalni očekivani ROI za "KUPI"
buy_min_demand = 0.60
buy_max_risk = 0.50
consider_roi = 0.10     # minimalni ROI za "RAZMOTRI"

[sizing]
max_budget_share = 0.25 # najviše ovoliki dio budžeta u jedan događaj
default_qty = 2         # parovi se najlakše prodaju
max_qty = 4

[risk]
personalized = 0.35
unknown_personalization = 0.08
legal_weight = 0.5
low_confidence = 0.20
far_event_days = 180
far_event = 0.10
payout_after_event = 0.05
postponed = 0.30
low_demand = 0.20
# Događaj izvan države prodavatelja: access_risk tržišta (markets.toml) × access_weight
access_weight = 0.35
unknown_access = 0.35

