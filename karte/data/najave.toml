# Izvori najava (RSS) – nove turneje, dodatni datumi, početak prodaje i presale ulaznica.
# RSS je format namijenjen strojnom čitanju (sindikaciji), pa ga aplikacija smije redovito dohvaćati.
# Provjereno 25. 11. 2026. Dodaj svoje izvore u ~/.karte/najave.toml (isti oblik; dopunjuje ove) ili:
#   karte najave --dodaj-izvor URL --naziv "..."   (npr. Google Alerts → Isporuči na: RSS feed)
#
# vrsta = "turneje"   – izvor piše samo o koncertima/turnejama (sve stavke su relevantne)
# vrsta = "opcenito"  – opći portal; zadržavaju se samo stavke s ključnim riječima (koncert, ulaznice, tour…)

[[izvor]]
naziv = "muzika.hr – turneje"
url = "https://www.muzika.hr/category/turneje/feed/"
jezik = "hr"
vrsta = "turneje"

[[izvor]]
naziv = "muzika.hr – najave"
