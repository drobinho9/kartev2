name: Tjedni radar ulaznica

# Automatsko skeniranje svakog ponedjeljka i četvrtka ujutro + ručno pokretanje.
# Postavi tajne u: Settings → Secrets and variables → Actions (sve su opcionalne):
#   SERPAPI_KEY (Google Events, 250 pretraga/mj. besplatno – 2 skeniranja tjedno ≈ 130 pretraga),
#   TICKETMASTER_API_KEY, PREDICTHQ_TOKEN, SEATGEEK_CLIENT_ID, LASTFM_API_KEY
# Bez ključeva za događaje workflow koristi snimku stvarnih događaja (karte/data/snimka) + Deezer/Wikipedia.

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
    inputs:
      days:
        description: "Koncerti u idućih N dana"
        default: "60"
      onsale_days:
        description: "Prodaje koje počinju u idućih N dana"
        default: "30"
      countries:
        description: "Države ili regije (npr. otvoreno, europa, sjeverna_amerika, svijet, US,GB)"
        default: "otvoreno"
      budget:
        description: "Budžet (EUR)"
        default: "1000"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Skeniranje
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PREDICTHQ_TOKEN: ${{ secrets.PREDICTHQ_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          # Wikimedia traži kontakt u User-Agentu – po želji postavi varijablu repozitorija KARTE_USER_AGENT
          KARTE_USER_AGENT: ${{ vars.KARTE_USER_AGENT || 'karte (GitHub Actions)' }}
          DAYS: ${{ github.event.inputs.days || '60' }}
          ONSALE_DAYS: ${{ github.event.inputs.onsale_days || '30' }}
          COUNTRIES: ${{ github.event.inputs.countries || 'otvoreno' }}
          BUDGET: ${{ github.event.inputs.budget || '1000' }}
        run: |
          mkdir -p reports
          EXTRA=""
          if [ -z "$TICKETMASTER_API_KEY$SERPAPI_KEY$PREDICTHQ_TOKEN$SEATGEEK_CLIENT_ID" ]; then
            echo "::notice::Nema ključeva za događaje – koristim snimku stvarnih događaja (docs/IZVORI_PODATAKA.md)."
            EXTRA="--snimka"
          fi
          if [ -f primjeri/moji_dogadaji.csv ]; then EXTRA="$EXTRA --csv primjeri/moji_dogadaji.csv"; fi
          ARGS="--days $DAYS --onsale-days $ONSALE_DAYS --countries $COUNTRIES --budget $BUDGET $EXTRA"
          karte scan $ARGS --format html --out reports/izvjestaj.html
          karte scan $ARGS --format md --out reports/izvjestaj.md
          karte scan $ARGS --format csv --out reports/izvjestaj.csv
          karte scan $ARGS --format json --out reports/izvjestaj.json
          karte scan $ARGS --only KUPI,RAZMOTRI --format md --top 15 > "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: radar-ulaznica-${{ github.run_number }}
          path: reports/
          retention-days: 30
